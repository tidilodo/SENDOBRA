name: Verify SENDOBRA
on: [push, pull_request, workflow_dispatch]
permissions:
  contents: read
jobs:
  verify:
    runs-on: ubuntu-latest
    timeout-minutes: 20
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1
      - uses: actions/setup-node@949feb2413d6458794dcd2491c4babbbce0c15c1
        with:
          node-version: 24
          cache: npm
      - run: node scripts/check-source-safety.mjs
      - run: npm ci --include=dev --include=optional --no-audit --no-fund
      - run: node --test tests/domain.test.mjs tests/whatsapp.test.mjs adapter/test.mjs adapter/audio-engine.test.mjs tests/receipts.test.mjs
      - run: npx --no-install tsc --noEmit
      - run: npm run build
